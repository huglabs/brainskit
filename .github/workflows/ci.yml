# The gate CONTRIBUTING asks every contributor to run by hand, run automatically.
#
# Order is deliberate. `lint` and `types` are fast and fail on the whole tree,
# so they gate the slower jobs. `wheel` is last because it is the only job that
# proves what actually ships: packaged prompt specs, output schemas and
# templates cannot be verified from the source tree, where they exist
# regardless of what the wheel contains.
#
# `ruff format --check` is intentionally absent. This project is lint-clean, not
# format-clean; adding it here would fail every run on a pre-existing diff
# rather than on anything a contributor did.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  check:
    name: lint and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-extras --group dev
      - run: uv run ruff check
      - run: uv run mypy

  tests:
    # The interpreter this project pins is 3.13; `requires-python` allows 3.11+.
    # An installed `bk` has to work on the floor of that range, not only on the
    # version a maintainer happens to develop on.
    name: tests (python ${{ matrix.python }})
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --python ${{ matrix.python }} --all-extras --group dev
      - run: uv run --python ${{ matrix.python }} pytest -q

  wheel:
    name: shipped wheel
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: ./scripts/verify-wheel.sh
      # Tracks 1 and 2 of the four-track review, against the wheel just built:
      # the getting-started guide followed literally, then every enforcement
      # layer broken in turn and required to show up in status and doctor.
      - run: ./scripts/fresh-install-smoke.sh
      - run: ./scripts/enforcement-harness.sh
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: dist
          path: dist/
          retention-days: 7

  dsh-bundle:
    # The DeepSeek Harness bundle's guard is the only thing between a cloud
    # model and a wider consumer or a mutation. It has no npm dependencies, so
    # the tests run straight from the checkout on both ends of `engines.node`.
    name: dsh-brainskit bundle (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    defaults:
      run:
        working-directory: plugins/dsh-brainskit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

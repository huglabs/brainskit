# Publish a tagged commit to PyPI through Trusted Publishing.
#
# No API token exists anywhere: the `publish` job exchanges a short-lived OIDC
# token for an upload credential, which is why it is a separate job holding
# `id-token: write` and nothing else. It runs no project code — it only uploads
# the artifacts `verify` already proved.
#
# A published version is permanent, so this refuses to upload anything it has
# not first built from the sdist, installed in a throwaway environment and
# driven through the real CLI contract.
#
# One-time setup, at https://pypi.org/manage/account/publishing/:
#   owner huglabs · repository brainskit · workflow release.yml · environment pypi

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"

jobs:
  verify:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # The tag is the durable record of which tree produced a version, so a
      # tag that disagrees with the metadata would make that record a lie.
      - name: the tag matches [project].version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag $GITHUB_REF_NAME does not match [project].version $version" >&2
            exit 1
          fi
          # `__version__` used to be a second literal and drifted to 0.4.0 while
          # this step happily passed on 0.5.0. It is now derived, so this checks
          # that the derivation still resolves rather than that two strings were
          # hand-synced -- and ./scripts/verify-wheel.sh re-asserts it against
          # the built artifact, which is the copy users actually install.
          reported="$(python3 -c 'import sys; sys.path.insert(0, "src"); import brainskit; print(brainskit.__version__)')"
          if [ "$reported" != "$version" ]; then
            echo "brainskit.__version__ is $reported, expected $version" >&2
            exit 1
          fi
          echo "brainskit $version"

      - run: uv sync --all-extras --group dev
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest -q
      - run: ./scripts/verify-wheel.sh

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish:
    name: pypi
    needs: verify
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/brainskit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

      # A release step that cannot fail is not a gate. `v0.5.0` failed three
      # times on `invalid-publisher` -- PyPI had no Trusted Publisher matching
      # this workflow's OIDC claim -- and the only way to find that out was to
      # notice, weeks later, that the README's install line did not work.
      #
      # So the job now asserts the thing it exists to cause: the version is
      # resolvable on PyPI afterwards. Retried, because the index is eventually
      # consistent and a fresh upload takes a few seconds to appear.
      - name: the version is actually on PyPI
        run: |
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])' 2>/dev/null || echo "${GITHUB_REF_NAME#v}")"
          for attempt in 1 2 3 4 5 6; do
            body="$(curl -fsSL "https://pypi.org/simple/brainskit/" || true)"
            case "$body" in
              *"brainskit-$version"*)
                echo "brainskit $version is on PyPI"
                exit 0
                ;;
            esac
            echo "attempt $attempt: $version not visible yet; waiting"
            sleep 10
          done
          echo "brainskit $version is not on PyPI after publishing" >&2
          echo "the upload step reported no error, which is how a silent" >&2
          echo "no-op ships as a green release" >&2
          exit 1

  github-release:
    name: github release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "brainskit ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*

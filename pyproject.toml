# PEP 639 — `license` as an SPDX expression and `license-files` as globs — is
# understood from setuptools 77. An older backend would silently drop the
# NOTICE the Apache licence requires the distribution to carry.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "brainskit"
version = "0.5.0"
description = "Local-first, LLM-agnostic second-brain engine: the compilation gate between raw evidence and knowledge an agent may act on"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "HugLabs" }]
keywords = [
  "knowledge-base",
  "second-brain",
  "provenance",
  "retrieval",
  "knowledge-graph",
  "code-graph",
  "mcp",
  "agents",
  "local-first",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Documentation",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
]
dependencies = ["jsonschema[format]>=4.20,<5"]

[project.urls]
Homepage = "https://github.com/huglabs/brainskit"
Documentation = "https://github.com/huglabs/brainskit/blob/main/docs/README.md"
Repository = "https://github.com/huglabs/brainskit"
Issues = "https://github.com/huglabs/brainskit/issues"
Changelog = "https://github.com/huglabs/brainskit/blob/main/CHANGELOG.md"

[project.optional-dependencies]
convert = ["markitdown"]
neo4j = ["neo4j>=5.25,<7"]
postgres = ["psycopg[binary]>=3.2,<4"]
integrations = ["neo4j>=5.25,<7", "psycopg[binary]>=3.2,<4"]
# The code graph. Vendoring Graphify's source did not vendor a parser: the
# tree-sitter grammars are compiled wheels and stay a real dependency, and they
# are the reason this is an extra rather than a base requirement — roughly 70 MB
# of them, for a capability most vaults never ask for. The core stays at one
# dependency. `bk code` reports what to install when they are absent.
#
# Grammar versions are pinned to the ranges the vendored extractors were written
# against; a grammar is a parser, and a newer one changes the shape of the tree
# the extractors walk.
code = [
  "tree-sitter>=0.26.0,<0.27",
  "tree-sitter-python>=0.23,<0.26",
  "tree-sitter-javascript>=0.23,<0.26",
  "tree-sitter-typescript>=0.23,<0.25",
  "tree-sitter-go>=0.23,<0.26",
  "tree-sitter-rust>=0.23,<0.25",
  "tree-sitter-java>=0.23,<0.25",
  "tree-sitter-c>=0.23,<0.25",
  "tree-sitter-cpp>=0.23,<0.25",
  "tree-sitter-c-sharp>=0.23,<0.25",
  "tree-sitter-ruby>=0.23,<0.25",
  "tree-sitter-php>=0.23,<0.25",
  "tree-sitter-bash>=0.23,<0.27",
  "tree-sitter-json>=0.23,<0.26",
  # Community detection, hub ranking, import cycles and graph diff.
  "networkx>=3.4",
]
# The rest of the grammars the vendored extractors can drive. They are a
# separate extra rather than part of `code` for the reason `code` is itself an
# extra: grammars are compiled wheels, and this roughly triples an already
# large download for languages most repositories do not contain.
#
# What makes it worth naming at all is that `codeanalysis/extractors/` ships a
# working extractor for every one of these. Without the grammar the extractor
# is unreachable code -- `bk code build` reports the file "contributed nothing"
# and the graph builds successfully around the hole. `tests/test_code_grammars.py`
# asserts that every grammar the extractors import appears in one of the two
# lists, so a new extractor cannot quietly land without one.
code-all = [
  "brainskit[code]",
  "tree-sitter-sql>=0.3,<1",
  "tree-sitter-swift>=0.7,<1",
  "tree-sitter-hcl>=1.2,<2",
  "tree-sitter-kotlin>=1.1,<2",
  "tree-sitter-objc>=3,<4",
  "tree-sitter-groovy>=0.1,<1",
  "tree-sitter-powershell>=0.26,<1",
  "tree-sitter-fortran>=0.6,<1",
  "tree-sitter-lua>=0.5,<1",
  "tree-sitter-elixir>=0.3,<1",
  "tree-sitter-julia>=0.23,<1",
  "tree-sitter-scala>=0.26,<1",
  "tree-sitter-zig>=1.1,<2",
  "tree-sitter-verilog>=1,<2",
  "tree-sitter-pascal>=0.11,<1",
  "tree-sitter-dm>=0.25,<1",
]

[project.scripts]
bk = "brainskit.interfaces.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.11,<0.13",
  "mypy>=1.15,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
brainskit = [
  "jobs/*.md",
  "jobs/_output-schemas/*.json",
  "templates/default/*.json",
  "templates/agents/*.md",
  "templates/agents/*.sh",
  "templates/web/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Ruff's default selection is E4/E7/E9 + F — undefined names and unused
# imports, essentially. Passing it said much less about this codebase than the
# README implied, so the gate now names what it actually enforces.
[tool.ruff]
line-length = 88
target-version = "py311"
# Vendored third-party source. It is kept byte-identical to upstream so a
# re-vendor is a copy rather than a merge, which means it cannot also satisfy a
# lint contract it was never written against — and reformatting it would make
# the next upstream diff unreadable. Scoped to the one path; everything
# Brainskit wrote is still gated.
# Provenance and the full reasoning: that directory's NOTICE.
extend-exclude = ["src/brainskit/infrastructure/codeanalysis"]

[tool.ruff.lint]
select = [
  "F",      # pyflakes
  "E", "W", # pycodestyle
  "I",      # import sorting
  "UP",     # pyupgrade: keep the 3.11+ baseline honest
  "B",      # bugbear
  "S",      # bandit: this engine has a write gate and a privacy boundary
  "A",      # builtin shadowing
  "C4",     # comprehensions
  "RUF",    # ruff's own checks
]
# Deliberately not selected: SIM. Its findings here are suggestions, not
# defects — nested `with` in tests, and `SIM115` on the atomic-write idiom,
# where `delete=False` is exactly the point and the handle is already cleaned
# up in an `except`. A gate that reports those trains people to skim it.
ignore = [
  # Line length is a formatter's job, and `ruff format` has never been applied
  # to this tree. Selecting E501 would report 100+ cosmetic findings that one
  # formatter run fixes, drowning out the rules that mean something.
  "E501",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on behaviour, and doing that needs the things bandit flags in
# production code: constructed URLs, hardcoded fixture credentials, subprocess
# calls, and asserts themselves.
"tests/*" = ["S101", "S105", "S106", "S108", "S310", "S603", "S607", "S608"]
# The managed-service adapter is a `docker` driver and a PostgreSQL client.
#   S603/S607 — every call is a fixed argument vector with no shell, invoking
#     `docker` by name on purpose: pinning an absolute path would break the
#     Docker Desktop, Colima and rootless layouts this has to run against.
#   S608 — PostgreSQL cannot bind an identifier as a parameter, so the schema
#     name is interpolated. It is whitelist-validated by `_sql_identifier`
#     first (`^[a-z_][a-z0-9_]{0,62}$`); every value is bound normally.
#   S104 — "0.0.0.0" appears in a published-port comparison, not in a bind.
#   S105 — the flagged constant is a redaction placeholder, not a credential.
"src/brainskit/infrastructure/integrations.py" = ["S104", "S105", "S603", "S607", "S608"]
# The flagged strings are the literal key name "token", used to look up an
# environment variable's name — never a value. The two subprocess calls carry
# their reasoning inline, at the site.
"src/brainskit/interfaces/cli.py" = ["S105"]
#   S607 — one fixed argument vector with no shell, asking `git` where it runs
#     hooks from. It must be the same `git` the operator's commit will use, so
#     it is invoked by name on PATH; an absolute path would answer for a
#     different install than the one that matters.
"src/brainskit/application/health.py" = ["S607"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
# `jsonschema`, `referencing`, `neo4j` and `psycopg` are optional or untyped;
# the modules that touch them already carry explicit ignores.
warn_unused_ignores = true
disallow_any_generics = true
# Vendored third-party source: byte-identical to upstream, so it cannot satisfy
# a strict contract it was never written against. The adapter that calls it is
# checked, which is where the boundary that matters actually is.
exclude = ["^src/brainskit/infrastructure/codeanalysis/"]

# numpy arrives through the `code-all` grammars and ships stubs written with
# `type` statements, which are a syntax error to a checker told to target
# 3.11 -- and one syntax error in a followed import stops the run before any
# of `src` is checked. `requires-python` is what decides the floor, so the
# floor stays and the third-party stubs are simply not parsed.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_errors = true

# neo4j, psycopg and markitdown ship type information, so an inline
# `import-not-found` ignore on them is unused wherever the extra is installed
# and required wherever it is not -- `warn_unused_ignores` makes that pair
# unsatisfiable. Declaring it here instead is true in both environments, which
# is what lets the same command check a bare install and a full one.
[[tool.mypy.overrides]]
module = ["neo4j.*", "psycopg.*", "markitdown.*"]
ignore_missing_imports = true

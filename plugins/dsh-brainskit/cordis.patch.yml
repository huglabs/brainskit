# Brainskit owns the vault and its policy. DSH owns this stdio child lifecycle.
- insert:
    - id: memory-brainskit-policy
      name: dsh-brainskit

    - id: memory-brainskit
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        # Do not rename. The dsh-brainskit guard matches tools named
        # mcp__brainskit__*; under another name it would match nothing and
        # every Brainskit tool would run unguarded.
        serverName: brainskit
        transport: stdio
        command: !!js process.env.BRAINSKIT_COMMAND || 'bk'
        args:
          - --vault
          - !!js process.env.BRAINSKIT_VAULT || process.cwd() + '/.brainskit'
          - serve
          - --mcp
          - --transport
          - stdio
          # The server's ceiling: every tool answers under it. DSH's default
          # model is a cloud API, so local evidence is opt-in.
          - --consumer
          - !!js process.env.BRAINSKIT_CONSUMER || 'cloud'
        cwd: !!js process.cwd()
        toolCallTimeoutMs: 120000
        failOnStartupError: !!js process.env.BRAINSKIT_FAIL_ON_STARTUP_ERROR === '1'
